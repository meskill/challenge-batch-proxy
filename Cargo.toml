[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["meskill"]
license = "MIT"

[package]
name = "challenge-batch-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "challenge-batch-proxy"
path = "src/main.rs"

[lib]
name = "challenge_batch_proxy"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tower-http = { version = "0.6.6", features = ["trace"] }
anyhow = "1"
envconfig = "0.11"
derive_more = { version = "2.0.1", features = ["display", "error", "from"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12.23", features = ["json"] }
strum = { version = "0.27.2", features = ["derive"] }
batch = { path = "./crates/batch" }

[dev-dependencies]
tokio-test = "0.4.4"
wiremock = "0.6.5"
axum-test = "18.0.2"
insta = { version = "1.43.1", features = ["json"] }

# PERF: optimize runs for insta package
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
